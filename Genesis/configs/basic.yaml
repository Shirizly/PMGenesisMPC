# SIMULATOR SETTINGS
simulation:
  dt: 4e-3
  substeps : 5
  # SETTLING. update_material_state steps until the pile is actually at rest;
  # settle_steps is the CAP, not a fixed count. Rationale for every value here
  # is in docs/scaling_to_200_objects.md section 1.3.
  #
  # Cap: measured steps-to-rest is ~250 after a push and ~1460 after a fresh
  # two-layer respawn (32 envs, 200 particles). 2500 leaves ~1.7x headroom on
  # the worst case; hitting the cap only warns, and silently records a
  # mid-motion state, which propagates because each transition's s is the
  # previous transition's s'.
  settle_steps : 2500
  settle_check_every : 10                   # steps between rest checks (one GPU sync each)
  settle_velocity_threshold : 1.0e-3        # m/s, matches Genesis' hibernation default
  # Fraction of particles that must be below threshold. Testing max() instead
  # makes the criterion harder the more envs are batched -- 32 envs x 200
  # particles is 6400 chances for one straggler to hold everyone up, and the
  # settle then always runs to its cap.
  settle_rest_quantile : 0.995
  # settle_angular_velocity_threshold is deliberately absent: it is derived from
  # the linear threshold and the particle's half body diagonal so both express
  # the same surface speed (~0.23 rad/s for a 5 mm cube). A bare rad/s number is
  # not comparable to a m/s one -- 0.1 rad/s on a 5 mm cube is 0.35 mm/s at the
  # corner, 3x stricter than the linear test, which silently made it binding.
  backend : gpu
  precision : '32'
  performance_mode : True

rigid_options:
  # Genesis' own defaults. Previously 10 / 10 / 1e-4 / 0.05, i.e. a fifth of the
  # solver budget. Measured A/B (tests/scaling_investigation/probe_settle_ab.py, 200 cubes): together
  # with holding the plate by control instead of re-teleporting it every step,
  # restoring these drops the settled-pile noise floor 8x (0.90 -> 0.11 mm/s at
  # q99.5) and the worst single particle from 25.1 mm/s / 7.22 rad/s to
  # 0.2 mm/s / 0.07 rad/s -- at 0.81x the baseline cost per step, because the
  # per-step collider/constraint resets that were removed cost more than the
  # extra iterations do.
  iterations: 50
  ls_iterations: 50
  tolerance: 1e-6
  ls_tolerance: 0.01
  box_box_detection: True
  use_contact_island: True
  use_hibernation: False

box:
  vol : [0.128, 0.128, 0.04]
  wall_thickness : 0.02
  friction : None                           # SET IN DATA_COLLECTION LOOP
material:
  vol : [0.127, 0.127, 0.05]
  shape : None                              # SET IN DATA_COLLECTION LOOP
  particle_size : None                      # SET IN DATA_COLLECTION LOOP
  n_particles : None                        # SET IN DATA_COLLECTION LOOP
  density : None                            # SET IN DATA_COLLECTION LOOP
  friction : None                           # SET IN DATA_COLLECTION LOOP
safety_margin : 0.005

plate:
  speed : 0.125 # m/s                       # cruise speed of the trapezoid profile
  size : [0.04, 0.002, 0.01]
  friction : 0.3                            # must be set: unset -> Genesis default 1.0,
                                            # and contacts combine as max(mu_plate, mu_particle),
                                            # which would mask the sampled particle friction

  # Actuator model. The real tool is carried by a 3D-printer-style Cartesian
  # gantry: a heavy carriage driven by steppers with far more force than the
  # push needs, tracking a trapezoidal velocity profile. So the quantity that
  # resists granular reaction is the drivetrain's reflected inertia, not the
  # plate's own weight -- moving_mass is applied via set_dofs_armature, which
  # adds to the mass-matrix diagonal the solver already uses for contacts.
  moving_mass : 0.5                         # kg, carriage + gripper reflected onto X/Y/Z
  acceleration : 2.0                        # m/s^2, trapezoid ramp
  control_bandwidth_hz : 15.0               # closed-loop bandwidth -> kp = m*w^2, kv = 2*m*w
  max_force : 30.0                          # N per axis; a real stepper skips steps instead
                                            # of applying unbounded force on a jam

