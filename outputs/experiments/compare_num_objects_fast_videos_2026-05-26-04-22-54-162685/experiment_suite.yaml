# compare_num_objects_fast_videos.yaml
#
# Compares GNN vs. Eulerian-splat across three object counts (5 / 10 / 20).
# All other settings match compare_models_fast_videos.yaml.
# Object type: carrots (default); global_scale and wkspc_w are unchanged.
#
# Usage:
#   bash scripts/run_experiments_headless_safe.sh \
#        simple_mpc/config/experiments/compare_num_objects_fast_videos.yaml

base_config: simple_mpc/config/config_simple.yaml

output:
  root_dir: outputs/experiments
  experiment_name: compare_num_objects_fast_videos

  save_rewards: true
  save_actions: true
  save_per_episode_npz: true
  save_reward_plot: true

  save_raw_obs: true
  save_states: false
  save_prediction_videos: true
  prediction_video_fps: 0.3

  benchmark_throughput: false
  success_threshold: 0.0

episodes:
  n_episodes: 10
  random_seed_base: 13

experiments:
  # ── 5 objects ──────────────────────────────────────────────────────────────
  # - name: splat_5_objects
  #   description: "Eulerian splat heuristic — 5 carrots"
  #   model:
  #     type: eulerian
  #     folder: None
  #     iter_num: -1
  #     need_weights: false
  #     heuristic_type: splat
  #   overrides:
  #     dataset.num_objects: 5
  #     dataset.render_width: 480
  #     dataset.render_height: 480
  #     dataset.fast_mode: true
  #     dataset.action_step_size: 0.03
  #     dataset.settle_steps: 50
  #     dataset.reset_warmup_steps: 200
  #     dataset.render_step_before_capture: false
  #     mpc.n_sample: 512
  #     mpc.n_update_iter: 50

  # # ── 10 objects ──────────────────────────────────────────────────────────────
  # - name: splat_10_objects
  #   description: "Eulerian splat heuristic — 10 carrots"
  #   model:
  #     type: eulerian
  #     folder: None
  #     iter_num: -1
  #     need_weights: false
  #     heuristic_type: splat
  #   overrides:
  #     dataset.num_objects: 10
  #     dataset.render_width: 480
  #     dataset.render_height: 480
  #     dataset.fast_mode: true
  #     dataset.action_step_size: 0.03
  #     dataset.settle_steps: 50
  #     dataset.reset_warmup_steps: 200
  #     dataset.render_step_before_capture: false
  #     mpc.n_sample: 512
  #     mpc.n_update_iter: 50

  # ── 20 objects ─────────────────────────────────────────────────────────────
  - name: splat_20_objects
    description: "Eulerian splat heuristic — 20 carrots"
    model:
      type: eulerian
      folder: None
      iter_num: -1
      need_weights: false
      heuristic_type: splat
    overrides:
      dataset.num_objects: 20
      dataset.render_width: 480
      dataset.render_height: 480
      dataset.fast_mode: true
      dataset.action_step_size: 0.03
      dataset.settle_steps: 50
      dataset.reset_warmup_steps: 200
      dataset.render_step_before_capture: false
      mpc.n_sample: 512
      mpc.n_update_iter: 50
