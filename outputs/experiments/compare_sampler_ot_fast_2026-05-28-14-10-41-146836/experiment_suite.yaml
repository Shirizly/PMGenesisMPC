# simple_mpc/config/experiments/compare_sampler_ot_fast.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Compare collision-aware vs OT-guided action samplers across the same three
# model architectures used in compare_models_fast.yaml.
#
# Sampler variants:
#   collision_aware  — orientation-stratified sampling, collision-free starts
#                      via plate-footprint dilation on the occupancy grid.
#   ot_guided        — OT coherent-region seeding for push directions,
#                      plus collision-aware random fill for the remainder.
#
# Models tested:
#   unet_shallow_32  — UNetFiLM shallow, 32×32
#   unet_deep_64     — UNetFiLM deep,    64×64
#   heuristic_spread_32 — Eulerian spread heuristic, 32×32 (no learned weights)
#
# All grid-size dependent sampler params (n_angles, d_min/max) are set
# per-experiment so they scale reasonably with the model resolution.
#
# Usage:
#   python run_experiments.py \
#       simple_mpc/config/experiments/compare_sampler_ot_fast.yaml
#   python run_experiments.py \
#       simple_mpc/config/experiments/compare_sampler_ot_fast.yaml --dry-run
# ──────────────────────────────────────────────────────────────────────────────

base_config: simple_mpc/config/config_simple.yaml


# ── output settings ───────────────────────────────────────────────────────────
output:
  root_dir:          outputs/experiments
  experiment_name:   compare_sampler_ot_fast

  save_rewards:          true
  save_actions:          true
  save_per_episode_npz:  true
  save_reward_plot:      true
  save_raw_obs:          false
  save_states:           false

  save_prediction_videos:  false
  prediction_video_fps:    0.4

  benchmark_throughput:  false
  success_threshold:     0.0


# ── shared episode settings ───────────────────────────────────────────────────
episodes:
  n_episodes:       1
  random_seed_base: 43


# ── shared fast-run overrides ─────────────────────────────────────────────────
x-fast: &fast
  dataset.settle_steps:       30
  dataset.reset_warmup_steps: 60
  dataset.pos_ctrl_steps:     30


# ── experiments ───────────────────────────────────────────────────────────────
experiments:

  # ── UNet shallow 32×32 — collision-aware ─────────────────────────────────────
  - name:        unet_shallow_32_collision_aware
    description: "UNetFiLM shallow 32×32 — collision-aware sampler"
    model:
      type:         unetfilm-shallow
      weights_path: runs_cubes/nfu_mse_mass2_shallowlowres/unet_best.pth
      grid_n:       32
      physics_dim:  3
    overrides:
      <<: *fast
      mpc.action_sampler: collision_aware

  # ── UNet shallow 32×32 — OT-guided ───────────────────────────────────────────
  - name:        unet_shallow_32_ot_guided
    description: "UNetFiLM shallow 32×32 — OT-guided sampler"
    model:
      type:         unetfilm-shallow
      weights_path: runs_cubes/nfu_mse_mass2_shallowlowres/unet_best.pth
      grid_n:       32
      physics_dim:  3
    overrides:
      <<: *fast
      mpc.action_sampler: ot_guided

  # ── UNet deep 64×64 — collision-aware ────────────────────────────────────────
  - name:        unet_deep_64_collision_aware
    description: "UNetFiLM deep 64×64 — collision-aware sampler"
    model:
      type:         unetfilm
      weights_path: runs_cubes/nfu_mse_mass2/unet_best.pth
      grid_n:       64
      physics_dim:  3
    overrides:
      <<: *fast
      mpc.action_sampler: collision_aware

  # ── UNet deep 64×64 — OT-guided ──────────────────────────────────────────────
  - name:        unet_deep_64_ot_guided
    description: "UNetFiLM deep 64×64 — OT-guided sampler"
    model:
      type:         unetfilm
      weights_path: runs_cubes/nfu_mse_mass2/unet_best.pth
      grid_n:       64
      physics_dim:  3
    overrides:
      <<: *fast
      mpc.action_sampler: ot_guided

  # ── Heuristic spread 32×32 — collision-aware ─────────────────────────────────
  - name:        heuristic_spread_32_collision_aware
    description: "Eulerian heuristic spread 32×32 — collision-aware sampler"
    model:
      type:           eulerian
      need_weights:   false
      heuristic_type: spread
      grid_n:         32
    overrides:
      <<: *fast
      mpc.action_sampler: collision_aware

  # ── Heuristic spread 32×32 — OT-guided ───────────────────────────────────────
  - name:        heuristic_spread_32_ot_guided
    description: "Eulerian heuristic spread 32×32 — OT-guided sampler"
    model:
      type:           eulerian
      need_weights:   false
      heuristic_type: spread
      grid_n:         32
    overrides:
      <<: *fast
      mpc.action_sampler: ot_guided
