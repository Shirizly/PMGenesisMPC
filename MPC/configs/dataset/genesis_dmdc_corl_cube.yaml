# Full corl/cube Genesis dataset for the DMDc falsification baseline
# (dmdc_baseline.py). 2006 files x ~17.6 = ~35,000 single-push transitions
# (NOT trajectories), spanning many physics/geometry groups: cube n10-n50,
# sizes 0.005-0.012, friction 0.05-0.50, density 750-5000, box friction
# 0.05-0.50 (every file is a distinct physics group).
#
# Because there are many physics groups, the registry's physics-group split
# yields a proper test set with physics parameters DISJOINT from train — a
# harder, more honest test of whether a physics-agnostic per-action linear map
# generalises across the physics distribution. Run with --split auto (default)
# or --split registry.

type: genesis

paths:
  - corl/cube

# DMDc does not use a val split, so put everything not held out for test into
# train. ~15% of files -> test (disjoint physics), ~85% -> train.
val_pct: 0
test_pct: 15

resolution_scale: 0.5   # box 0.128 m -> 64x64 grid
include_physics: true

physics:
  normalization:
    friction: {min: 0.05, max: 0.50}
    density: {min: 750.0, max: 5000.0}
    box_friction: {min: 0.05, max: 0.50}
