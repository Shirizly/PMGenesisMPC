# Training config: fine-tune a pre-trained NFDUNetFiLM checkpoint
# on a new dataset (e.g. real chickpeas or different particle count).
#
# Usage:
#   python -m training.train configs/training/unetfilm_finetune.yaml \
#       --override pretrained_checkpoint=runs_cubes/unetfilm_genesis/unet_best.pth

model:   configs/model/unetfilm.yaml
dataset: configs/dataset/real_chickpeas.yaml

# Path to a pre-trained checkpoint to load before training begins.
# The Trainer will call _try_resume() first (which loads output.log_dir/unet_best.pth
# if it exists); this key is for loading a separate seed checkpoint.
# Handled by: python -m training.train ... --override pretrained_checkpoint=PATH
pretrained_checkpoint: ~   # null = train from scratch

training:
  epochs:              50
  batch_size:          32
  lr:                  5.0e-5     # lower LR for fine-tuning

  lr_scheduler:
    type:       StepLR
    step_size:  50
    gamma:      0.5

  augmentation:        true
  patience:            50
  mixed_precision:     true
  grad_clip_norm:      1.0
  save_every_n_epochs: 10
  num_workers:         4

  loss:
    type:       eulerian_combined
    mse:        1.0
    mass:       0.2
    dice:       0.0
    bce:        0.0
    sharpness:  0.0
    tv:         0.0
    add:        0.0
    remove:     0.0

inference:
  representation:    eulerian
  grid_n:            128
  plate_length_m:    0.04
  plate_width_m:     0.002
  plate_sigma_px:    1.5
  wkspc_w:           0.064
  global_scale:      0.6
  particle_friction: 0.05
  particle_density:  750.0
  box_friction:      0.05

output:
  log_dir: runs_cubes/unetfilm_finetune
