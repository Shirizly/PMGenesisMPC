model:
  type: unetfilm
  in_channels: 2
  cond_dim: 3
  uses_physics: true
  input_mode: standard
  residual_channel: 0
  depth: 2
dataset:
  type: genesis
  paths:
  - corl/cube/n10
  - corl/cube/n20
  - corl/cube/n30
  - corl/cube/n40
  - corl/cube/n50
  val_pct: 5
  test_pct: 5
  resolution_scale: 1.0
  include_physics: true
  transforms:
  - type: ensure_representation
    representation: eulerian
  - type: eulerian_aliases
  physics:
    normalization:
      friction:
        min: 0.05
        max: 0.5
      density:
        min: 750.0
        max: 5000.0
      box_friction:
        min: 0.05
        max: 0.5
training:
  epochs: 100
  batch_size: 64
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 100
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.2
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0
inference:
  representation: eulerian
  grid_n: 128
  plate_length_m: 0.04
  plate_width_m: 0.002
  plate_sigma_px: 1.5
  wkspc_w: 0.064
  global_scale: 0.6
  particle_friction: 0.05
  particle_density: 750.0
  box_friction: 0.05
output:
  log_dir: runs_cubes/unetfilm_genesis
_config_path: /home/alon/Code/pile_manipulation/configs/training/unetfilm_genesis.yaml
