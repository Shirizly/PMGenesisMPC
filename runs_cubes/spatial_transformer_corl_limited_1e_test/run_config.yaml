model:
  type: spatial-transformer
  in_channels: 2
  uses_physics: true
  base_channels: 32
  depth: 3
  flow_scale: 0.1
dataset:
  type: genesis
  paths:
  - corl_limited/cubes
  val_pct: 10
  test_pct: 10
  resolution_scale: 0.5
  include_physics: true
  transforms:
  - type: ensure_representation
    representation: eulerian
  - type: eulerian_aliases
  physics:
    normalization:
      friction:
        min: 0.05
        max: 0.5
      density:
        min: 750.0
        max: 5000.0
      box_friction:
        min: 0.05
        max: 0.5
training:
  epochs: 1
  batch_size: 32
  lr: 0.001
  augmentation: false
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 1
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.2
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0
inference:
  representation: eulerian
  grid_n: 128
  plate_length_m: 0.04
  plate_width_m: 0.002
  plate_sigma_px: 1.5
  wkspc_w: 0.064
  global_scale: 0.6
  particle_friction: 0.25
  particle_density: 750.0
  box_friction: 0.3
output:
  log_dir: runs_cubes/spatial_transformer_corl_limited_1e_test
_config_path: /home/alon/Code/pile_manipulation/configs/training/spatial_transformer_corl_limited_1e_test.yaml
