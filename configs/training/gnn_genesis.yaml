# Train PropNetDiffDenModel on Genesis particle transitions
# via unified trainer.

model: configs/model/gnn_propnet.yaml
dataset: configs/dataset/genesis_particles.yaml

training:
  epochs: 500
  batch_size: 8
  lr: 5e-3
  lr_scheduler:
    type: StepLR
    step_size: 100
    gamma: 0.75
  augmentation: false
  patience: 200
  mixed_precision: false
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  loss:
    type: lagrangian_mse

inference:
  representation: lagrangian

output:
  log_dir: runs_cubes/gnn_genesis
