# Piled 30-cube dataset with pile-aware 20 mm pushes, for re-running the
# linear-foresight comparison on actual piles rather than a sparse single layer.
# Collected by Genesis/configs/collection_pile30.yaml; see
# docs/piled_collection.md.
#
# Same geometry and material as genesis_foresight_L040.yaml. The push length
# differs (20 mm here vs 40 mm there): a settled pile spreads past the blade's
# allowed workspace box, so a 40 mm push from a pile-contact start could not fit
# and 3.3% travelled ~0 mm. See Genesis/configs/collection_pile30.yaml for the
# measurements. Any comparison between the two datasets must therefore treat
# push length as a difference, not hold it fixed.

type: genesis

paths:
  - foresight/pile30/cube/n30/size0.005
  - foresight/pile30_8env/cube/n30/size0.005

val_pct: 0
test_pct: 0

resolution_scale: 0.5   # box 0.128 m -> 64x64 grid
include_physics: true

physics:
  normalization:
    friction: {min: 0.05, max: 0.50}
    density: {min: 750.0, max: 5000.0}
    box_friction: {min: 0.05, max: 0.50}
